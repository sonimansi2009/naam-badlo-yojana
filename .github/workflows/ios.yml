name: iOS build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild name dictionary
        run: python3 dictionary/build.py

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Show available SDKs
        run: xcodebuild -version && xcodebuild -showsdks

      - name: Build for simulator (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NaamBadlo.xcodeproj -target NaamBadlo \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:" build.log | head -40 || true
