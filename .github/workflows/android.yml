name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild name dictionary
        run: python3 dictionary/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NaamBadlo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NaamBadlo-apk
          path: NaamBadlo.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NaamBadlo.apk
