name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild name dictionary
        run: python3 dictionary/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Use private signing key if set
        env:
          KS: ${{ secrets.NC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.NC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NC_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "NC_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "NC_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "NC_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "::notice::Signing with private key from secrets"
          fi

      - name: Test and build
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle --no-daemon testFullDebugUnitTest assembleFullRelease assembleLiteRelease 2>&1 | tee build.log; then
            # Surface the real error as annotations (job logs are not always reachable)
            grep -E "^e: |error:|ERROR:|FAILED|What went wrong|Exception|expected:" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/full/release/app-full-release.apk ShadowbanSurakshaYojana.apk
          cp android/app/build/outputs/apk/lite/release/app-lite-release.apk ShadowbanSurakshaYojana-Lite.apk

      - name: Check both APKs are signed, and Lite has no accessibility service
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in ShadowbanSurakshaYojana.apk ShadowbanSurakshaYojana-Lite.apk; do
            $BT/apksigner verify $f
            echo "::notice title=$f::$($BT/apksigner verify --verbose $f | grep -E 'Verified using v2' | tr '\n' ' ') $($BT/aapt2 dump badging $f | grep -E '^package' | tr '\n' ' ')"
          done
          FULL=$($BT/aapt2 dump xmltree --file AndroidManifest.xml ShadowbanSurakshaYojana.apk | grep -c BIND_ACCESSIBILITY_SERVICE || true)
          LITE=$($BT/aapt2 dump xmltree --file AndroidManifest.xml ShadowbanSurakshaYojana-Lite.apk | grep -c BIND_ACCESSIBILITY_SERVICE || true)
          echo "::notice title=Accessibility::full=$FULL lite=$LITE"
          if [ "$LITE" != "0" ] || [ "$FULL" = "0" ]; then echo "::error::Lite must have no accessibility service and Full must have it"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowbanSurakshaYojana-apk
          path: |
            ShadowbanSurakshaYojana.apk
            ShadowbanSurakshaYojana-Lite.apk

      - name: Read version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # Every build of main becomes a GitHub release, so the website can link to
      # .../releases/latest/download/ShadowbanSurakshaYojana.apk
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Shadowban Suraksha Yojana ${{ steps.v.outputs.name }}
          make_latest: true
          body: |
            **Which file?**
            - **ShadowbanSurakshaYojana.apk**: the full app, with the floating button that pops up in Instagram & WhatsApp. Android may ask you to pause Play Protect once to install it.
            - **ShadowbanSurakshaYojana-Lite.apk**: installs without warnings. Keyboard, select text, encode and decode, but no floating button.

            Open the file on your phone and allow "Install unknown apps" when asked. Updating keeps your settings.
          files: |
            ShadowbanSurakshaYojana.apk
            ShadowbanSurakshaYojana-Lite.apk
